name: patchpilot_mobile
description: "PatchPilot Mobile Client - Phone-First Developer Diagnostic Copilot for iQOO Hackathon"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Vision & Camera
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.14.0
  
  # Voice & Audio
  speech_to_text: ^7.0.0
  
  # Networking & HTTP
  http: ^1.2.2
  
  # Utilities & Storage
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

