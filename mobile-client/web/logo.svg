<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Pure Obsidian Black -->
  <rect width="512" height="512" rx="100" fill="#000000"/>
  
  <!-- Outer Viewfinder Reticle Ring with Horizontal Gap -->
  <!-- Left Reticle Arc -->
  <path d="M 118 256 A 140 140 0 1 1 394 256" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom Reticle Arc -->
  <path d="M 394 256 A 140 140 0 0 1 118 256" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left & Right Targeting Notches -->
  <line x1="90" y1="256" x2="114" y2="256" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <line x1="398" y1="256" x2="422" y2="256" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>

  <!-- Git Branch Nodes & Connecting Circuit Traces -->
  <!-- Top/Right Branch Line & Node -->
  <line x1="280" y1="240" x2="330" y2="295" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <circle cx="330" cy="295" r="18" fill="#FFFFFF"/>
  
  <!-- Lower Branch Line & Node -->
  <line x1="265" y1="315" x2="295" y2="350" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <circle cx="295" cy="350" r="15" fill="#FFFFFF"/>

  <!-- Central Sharp Geometric Lightning Bolt Shape -->
  <polygon points="256,98 184,266 260,266 182,422 344,228 266,228 338,98" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="18" 
           stroke-linejoin="miter" 
           stroke-miterlimit="4"/>
</svg>
